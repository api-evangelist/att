- type: Features
  data:
  - name: CAMARA Industry-Standard APIs
    description: Implements GSMA CAMARA open-source standard APIs including SIM Swap, Device Status, Number Verification,
      and Quality on Demand for cross-carrier interoperability.
  - name: Network API Accelerator Program
    description: Invite-only early access program for developers to trial pre-release 5G network APIs and influence future
      network capability development.
  - name: 5G Network Capabilities
    description: Exposes AT&T's 5G network intelligence including QoS on demand, network performance insights, and device
      connectivity status.
  - name: Fraud Prevention Network Signals
    description: Network-based fraud signals including SIM swap detection, number verification, and mobility threat detection
      to strengthen app security.
- type: UseCases
  data:
  - name: SIM Swap Fraud Prevention
    description: Detect recent SIM card changes to prevent account takeover attacks and strengthen multi-factor authentication
      flows.
  - name: Frictionless Mobile Authentication
    description: Verify device phone numbers silently via the network without OTP codes, reducing authentication friction
      in mobile apps.
  - name: 5G Quality of Service Optimization
    description: Request guaranteed bandwidth or low latency for real-time applications like video conferencing, AR/VR,
      and industrial IoT.
  - name: Device Connectivity Monitoring
    description: Monitor device connectivity and roaming status to trigger location-aware application behaviors.
  - name: Threat Detection and Security
    description: Leverage AT&T network ML-based threat signals to detect anomalous device behavior and security incidents.
  - name: Enterprise Digital Transformation
    description: Automate wireline service ordering, qualification, and provisioning for enterprise customers through API
      integration.
  - name: Mobile App Authentication
    description: Use AT&T network signals for frictionless authentication and fraud prevention in consumer and business
      mobile applications.
  - name: IoT and Edge Computing
    description: Connect and manage IoT devices using AT&T's 5G and LTE networks with quality of service guarantees for
      mission-critical applications.
  - name: MVNO Launch and Operations
    description: Launch and operate mobile virtual network services on AT&T's infrastructure using TM Forum-standard management
      APIs.
  - name: Workforce Communication
    description: Integrate AT&T voice and messaging APIs into business workflows for employee and customer communication
      automation.
  - name: SMS Alerts and Notifications
    description: Send security verification codes, appointment reminders, promotional offers, and customer feedback requests
      via SMS short code.
  - name: In-App Messaging Integration
    description: Embed MMS and SMS messaging directly into mobile applications with full inbox management capabilities.
  - name: Mobile Virtual Network Operations
    description: Launch and operate MVNO services using AT&T's network with automated subscriber onboarding, porting, and
      lifecycle management.
  - name: Enterprise Wireline Ordering
    description: Automate service qualification, quoting, and order submission for enterprise connectivity services.
- type: Integrations
  data:
  - name: Aduna Network API Platform
    description: AT&T's partnership with Aduna provides standardized access to AT&T 5G Network APIs with cross-carrier interoperability
      for all three major U.S. carriers.
  - name: Vonage (Ericsson)
    description: Collaboration with Vonage to bring AT&T CAMARA network APIs to communications platform developers.
  - name: GSMA CAMARA
    description: Member of GSMA's CAMARA open-source project defining standardized telco network APIs for cross-operator
      portability.
  - name: Microsoft Azure
    description: AT&T and Microsoft partnership for 5G and Azure-powered edge computing solutions for enterprise applications.
  - name: Cisco
    description: Integration with Cisco enterprise networking and collaboration solutions through AT&T's business services.
  - name: IBM
    description: AT&T and IBM partnership for AI-powered network management and cloud services integration.
  - name: TM Forum Open APIs
    description: MVNX and enterprise APIs follow TM Forum Open API standards for telecom BSS/OSS interoperability.
  - name: IBM Worklight
    description: AT&T API Platform Adapters for IBM Worklight mobile development platform.
  - name: Salesforce Platform
    description: AT&T Toolkit for Salesforce enabling speech and messaging API integration in Salesforce apps.
  - name: TM Forum APIs
    description: MVNX APIs align with TM Forum Open API standards including TMF 622, 637, 639, 640, 654, 674, 689, 702,
      716, and 761.
- type: Solutions
  data:
  - name: AT&T Business
    description: Comprehensive connectivity, cloud, cybersecurity, and collaboration solutions for small, medium, and enterprise
      businesses.
  - name: FirstNet
    description: Dedicated broadband network for America's first responders including priority access, preemption, and dedicated
      coverage expansion.
  - name: AT&T Wholesale
    description: Network services for carriers, MVNOs, and resellers including voice, data, and roaming services on AT&T's
      infrastructure.
