aid: att
name: AT&T
description: 'AT&T Inc. is a multinational telecommunications holding company providing wireless and wireline communications,
  broadband, and business networking to consumers and enterprises. Its developer surface spans four programs: the legacy
  AT&T Developer Program (SMS, MMS, in-app messaging, speech and OAuth), the MVNX APIs for mobile virtual network operators,
  the Alliance enterprise wireline APIs for service qualification and ordering, and the invite-only Network API Accelerator
  Program exposing GSMA CAMARA network APIs — SIM swap, device status, number verification, quality on demand, network insights
  and mobility threat detection.'
