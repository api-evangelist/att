  schemas:
    security:
    - name: SimSwapCheckRequest
      description: Request for SIM swap detection
      properties:
      - phoneNumber
      - maxAge
    - name: SimSwapCheckResponse
      description: SIM swap detection result
      properties:
      - swapped
    - name: NumberVerificationRequest
      description: Phone number verification request
      properties:
      - phoneNumber
    - name: NumberVerificationResponse
      description: Number verification result
      properties:
      - devicePhoneNumberVerified
    - name: ThreatAssessment
      description: Device threat assessment with risk level and indicators
      properties:
      - riskLevel
      - anomalyScore
      - threats
    connectivity:
    - name: DeviceConnectivityStatus
      description: Device network connectivity state
      properties:
      - connectivityStatus
      - roaming
    - name: DeviceRoamingStatus
      description: Device roaming information
      properties:
      - roaming
      - countryCode
      - countryName
    - name: NetworkMetrics
      description: Network performance metrics for a device
      properties:
      - networkGeneration
      - signalStrength
      - estimatedDownlinkThroughput
      - estimatedLatency
      - congestionLevel
    qos:
    - name: CreateSessionRequest
      description: QoD session creation request
      properties:
      - device
      - qosProfile
      - duration
    - name: SessionInfo
      description: QoD session details and status
      properties:
      - sessionId
      - qosProfile
      - qosStatus
      - expiresAt
  parameters:
    identifiers:
    - name: phoneNumber
      type: string
      description: E.164 format phone number
      apis:
      - att-sim-swap
      - att-device-status
      - att-number-verification
      - att-qod
      - att-network-insights
      - att-mtad
    - name: sessionId
      type: string
      description: QoD session identifier
      apis:
      - att-qod
    filters:
    - name: maxAge
      type: integer
      description: Maximum age in hours for SIM swap lookback
      apis:
      - att-sim-swap
  enums:
    connectivity-status:
    - CONNECTED_DATA
    - CONNECTED_SMS
    - NOT_CONNECTED
    qos-profiles:
    - LOW_LATENCY
    - THROUGHPUT_S
    - THROUGHPUT_M
    - THROUGHPUT_L
    - VOICE
    qos-status:
    - REQUESTED
    - AVAILABLE
    - UNAVAILABLE
    signal-strength:
    - EXCELLENT
    - GOOD
    - FAIR
    - POOR
    network-generation:
    - 5G
    - 5G_NSA
    - 4G
    - 3G
    congestion-level:
    - LOW
    - MEDIUM
    - HIGH
    risk-level:
    - LOW
    - MEDIUM
    - HIGH
    - CRITICAL
    threat-types:
    - UNUSUAL_LOCATION
    - ABNORMAL_DATA_USAGE
    - KNOWN_MALWARE_TRAFFIC
    - SIM_CLONING
    - ROAMING_ANOMALY
    - CALL_PATTERN_ANOMALY
  authentication:
    schemes:
    - name: OAuth 2.0 Client Credentials
      type: oauth2
      flows:
      - client_credentials
      apis:
      - att-sim-swap
      - att-device-status
      - att-number-verification
      - att-qod
      - att-network-insights
      - att-mtad
capability:
  workflows:
  - name: Network Security
    description: Network-based fraud prevention and authentication using SIM Swap and Number Verification
    apisComposed:
    - att-sim-swap
    - att-number-verification
    toolCount: 3
    personas:
    - Security Developer
    - Identity Developer
    domains:
    - Security
    - Authentication
  - name: Network Performance
    description: 5G connectivity monitoring and QoS optimization using Device Status and Quality on Demand
    apisComposed:
    - att-device-status
    - att-qod
    toolCount: 6
    personas:
    - App Developer
    - IoT Engineer
    domains:
    - Network Performance
    - Connectivity
  - name: Messaging
    description: SMS notifications and in-app messaging for mobile apps and enterprise systems
    apisComposed:
    - att-sms
    - att-iam
    toolCount: 8
    personas:
    - App Developer
    - Enterprise Developer
    domains:
    - Messaging
    - Mobile
  - name: MVNO Operations
    description: Complete MVNO subscriber lifecycle and number portability management
    apisComposed:
    - att-mvnx
    toolCount: 8
    personas:
    - MVNO Operator
    - Telecom Engineer
    domains:
    - MVNO
    - Telecommunications
  - name: Wireless Messaging
    description: SMS messaging and OAuth authentication for consumer and business applications
    apisComposed:
    - att-wireless-apis
    toolCount: 3
    personas:
    - App Developer
    - Enterprise Developer
    domains:
    - Messaging
    - Authentication
  personas:
  - id: app-developer
    name: App Developer
    description: Mobile or web application developer embedding messaging into consumer apps
    workflows:
    - Messaging
  - id: enterprise-developer
    name: Enterprise Developer
    description: Developer building enterprise notification, alerting, or communication systems
    workflows:
    - Messaging
  - id: mvno-operator
    name: MVNO Operator
    description: MVNO business operator managing AT&T-powered mobile subscribers and services
    workflows:
    - MVNO Operations
  - id: telecom-engineer
    name: Telecom Engineer
    description: Engineer integrating AT&T network services with BSS/OSS systems via TM Forum APIs
    workflows:
    - MVNO Operations
  - id: app-developer
    name: App Developer
    description: Mobile or web developer building consumer applications on AT&T APIs
    workflows:
    - Wireless Messaging
  - id: enterprise-developer
    name: Enterprise Developer
    description: Developer integrating AT&T enterprise connectivity and eBonding APIs
    workflows:
    - Wireless Messaging
  - id: security-developer
    name: Security Developer
    description: Developer building fraud prevention and identity verification using AT&T network signals
    workflows:
    - Network Security
  - id: identity-developer
    name: Identity Developer
    description: Developer implementing frictionless mobile authentication via AT&T network
    workflows:
    - Network Security
  - id: mvno-operator
    name: MVNO Operator
    description: Mobile virtual network operator managing subscribers on AT&T infrastructure
    workflows: []
  - id: telecom-engineer
    name: Telecom Engineer
    description: Engineer integrating enterprise wireline services and eBonding systems
    workflows: []
  - id: security-developer
    name: Security Developer
    description: Developer building fraud prevention and identity verification using network signals
    workflows:
    - Network Security
  - id: identity-developer
    name: Identity Developer
    description: Developer implementing passwordless or frictionless mobile authentication
    workflows:
    - Network Security
  - id: app-developer
    name: App Developer
    description: Mobile or web developer building connectivity-aware applications
    workflows:
    - Network Performance
  - id: iot-engineer
    name: IoT Engineer
    description: Engineer managing IoT device connectivity and optimizing 5G performance for industrial applications
    workflows:
    - Network Performance
  domains:
  - name: Messaging
    description: SMS and MMS messaging services for consumer and enterprise applications
    resources:
    - sms-messages
    - in-app-messages
    - inbox
  - name: MVNO
    description: Mobile virtual network operator services on AT&T infrastructure
    resources:
    - subscribers
    - phone-numbers
    - portability-orders
    - devices
    - balance
    - services
  - name: Mobile
    description: Mobile network connectivity and subscriber management
  - name: Messaging
    description: SMS and in-app messaging services
    resources:
    - sms-messages
  - name: Security
    description: Network-based fraud detection and threat intelligence
    resources:
    - sim-swap
    - number-verification
    - threat-assessment
  - name: Authentication
    description: OAuth and network-based authentication
    resources:
    - oauth-tokens
    - number-verification
  - name: Connectivity
    description: Device status, roaming, and QoS management
    resources:
    - device-connectivity
    - device-roaming
    - qod-sessions
    - network-metrics
  - name: Enterprise
    description: Wireline service ordering and qualification
    resources:
    - service-qualification
    - product-orders
  - name: Security
    description: Network-based security signals for fraud detection and identity verification
    resources:
    - sim-swap
    - number-verification
    - device-threats
  - name: Authentication
    description: Mobile network-based authentication without OTP
    resources:
    - number-verification
  - name: Network Performance
    description: 5G network quality monitoring and on-demand QoS enhancement
    resources:
    - qod-sessions
    - network-metrics
    - device-connectivity
    - device-roaming
  namespaces:
    consumed:
    - att-sim-swap
    - att-device-status
    - att-number-verification
    - att-qod
    - att-network-insights
    - att-mtad
    rest:
    - namespace: att-network-security-api
      port: 8080
    - namespace: att-network-performance-api
      port: 8081
    mcp:
    - namespace: att-network-security-mcp
      port: 9090
    - namespace: att-network-performance-mcp
      port: 9091
  binds:
  - name: ATT_SMS_ACCESS_TOKEN
    description: OAuth 2.0 bearer token for AT&T SMS API
    workflows:
    - Messaging
  - name: ATT_IAM_ACCESS_TOKEN
    description: OAuth 2.0 bearer token for AT&T In-App Messaging API (user consent)
    workflows:
    - Messaging
  - name: ATT_MVNX_CLIENT_ID
    description: Client ID for AT&T MVNX API authentication
    workflows:
    - MVNO Operations
  - name: ATT_NETWORK_API_TOKEN
    description: OAuth 2.0 bearer token for all AT&T CAMARA network APIs
    workflows:
    - Network Security
    - Network Performance
