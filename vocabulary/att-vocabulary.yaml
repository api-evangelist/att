vocabulary: 1.0.0
info:
  provider: AT&T
  description: Unified taxonomy of AT&T's developer APIs spanning wireless messaging, in-app messaging, MVNO operations,
    enterprise wireline connectivity, and the CAMARA 5G network APIs.
  version: 1.0.0
  updated: '2026-07-25'
operational:
  apis:
  - namespace: att-sim-swap
    name: AT&T SIM Swap API
    version: '1.0'
    baseUrl: https://api.att.com/camara/sim-swap/v1
    status: active
  - namespace: att-device-status
    name: AT&T Device Status API
    version: '1.0'
    baseUrl: https://api.att.com/camara/device-status/v1
    status: active
  - namespace: att-number-verification
    name: AT&T Number Verification API
    version: '1.0'
    baseUrl: https://api.att.com/camara/number-verification/v1
    status: active
  - namespace: att-qod
    name: AT&T Quality on Demand API
    version: '1.0'
    baseUrl: https://api.att.com/camara/qod/v1
    status: active
  - namespace: att-network-insights
    name: AT&T Network Insights API
    version: '1.0'
    baseUrl: https://api.att.com/network/insights/v1
    status: active
  - namespace: att-mtad
    name: AT&T Mobility Threat and Anomaly Detection API
    version: '1.0'
    baseUrl: https://api.att.com/network/threat-detection/v1
    status: active
  - namespace: att-sms
    name: AT&T SMS API
    version: '3.0'
    baseUrl: https://api.att.com
    status: active
  - namespace: att-iam
    name: AT&T In-App Messaging API
    version: '2.0'
    baseUrl: https://api.att.com
    status: active
  - namespace: att-mvnx
    name: AT&T MVNX API
    version: 4.0.0
    baseUrl: https://devex-web.att.com
    status: active
  - namespace: att-alliance
    name: AT&T Alliance Wireline APIs
    version: '1.0'
    baseUrl: https://devex-web.att.com
