description: AT&T does not publish public API pricing. Access to the wireless messaging, MVNO, enterprise wireline
  and CAMARA network APIs is negotiated through partner / B2B contracts with AT&T enterprise sales. The Network
  API Accelerator Program that fronts the CAMARA network APIs is invite-only and pre-GA.
notes: Pre-release / invite-only program. Public price list does not exist as of the modified date. Expect commercial
  terms similar to other CAMARA carriers (per-call or volume-tier pricing) once the program reaches GA.
