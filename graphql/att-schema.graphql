"""
AT&T Telecommunications and Network Services — Conceptual GraphQL Schema
Developer Portal: https://developer.att.com/
"""

# ─── Scalars ────────────────────────────────────────────────────────────────

scalar DateTime
scalar Date
scalar JSON
scalar URL
scalar PhoneNumberString
scalar GeoCoordinate

# ─── Enums ──────────────────────────────────────────────────────────────────

enum AccountStatus {
  ACTIVE
  SUSPENDED
  CLOSED
  PENDING
}

enum SubscriberStatus {
  ACTIVE
  SUSPENDED
  DEACTIVATED
  PENDING_ACTIVATION
}

enum DeviceType {
  SMARTPHONE
  TABLET
  WEARABLE
  HOTSPOT
  ROUTER
  IOT_DEVICE
  CONNECTED_CAR
  LAPTOP
}

enum NetworkTechnology {
  FIVE_G
  LTE
  HSPA
  EDGE
  CDMA
}

enum CallStatus {
  COMPLETED
  MISSED
  VOICEMAIL
  REJECTED
  IN_PROGRESS
}

enum CallDirection {
  INBOUND
  OUTBOUND
}

enum MessageStatus {
  SENT
  DELIVERED
  READ
  FAILED
  PENDING
}

enum PortStatus {
  SUBMITTED
  IN_PROGRESS
  COMPLETED
  REJECTED
  CANCELLED
}

enum TicketStatus {
  OPEN
  IN_PROGRESS
  PENDING_CUSTOMER
  RESOLVED
  CLOSED
}

enum TicketPriority {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

enum PaymentStatus {
  PENDING
  COMPLETED
  FAILED
  REFUNDED
}

enum RoamingStatus {
  ENABLED
  DISABLED
  RESTRICTED
}

enum PlanType {
  CONSUMER
  BUSINESS
  PREPAID
  FIRSTNET
  ENTERPRISE
  IOT
}

enum TokenType {
  ACCESS
  REFRESH
  OAUTH2
}

enum UpgradeEligibility {
  ELIGIBLE
  NOT_YET_ELIGIBLE
  NEXT_UP
  EARLY_UPGRADE
}

# ─── Account & Identity ─────────────────────────────────────────────────────

"""A top-level AT&T billing and service account."""
type Account {
  id: ID!
  accountNumber: String!
  status: AccountStatus!
  profile: AccountProfile
  subscribers: [Subscriber!]
  plan: ServicePlan
  invoices: [Invoice!]
  paymentMethods: [PaymentMethod!]
  contract: Contract
  apiKeys: [APIKey!]
  createdAt: DateTime!
  modifiedAt: DateTime!
}

"""Contact details, preferences, and identity for an account holder."""
type AccountProfile {
  id: ID!
  account: Account!
  firstName: String!
  lastName: String!
  email: String
  phoneNumber: PhoneNumberString
  address: String
  city: String
  state: String
  zipCode: String
  country: String
  language: String
  paperlessBilling: Boolean!
  autoPayEnabled: Boolean!
  createdAt: DateTime!
  modifiedAt: DateTime!
}

"""An individual line or service user under an AT&T account."""
type Subscriber {
  id: ID!
  account: Account!
  status: SubscriberStatus!
  phoneNumber: PhoneNumber
  msisdn: MSISDN
  device: Device
  simCard: SIMCard
  plan: ServicePlan
  addOns: [AddOn!]
  features: [Feature!]
  dataUsage: DataUsage
  dataBalance: DataBalance
  roamingProfile: RoamingProfile
  callRecords: [CallRecord!]
  voicemail: [Voicemail!]
  callForwarding: CallForwarding
  callerId: CallerId
  fiveG: FiveG
  firstNet: FirstNet
  createdAt: DateTime!
  modifiedAt: DateTime!
}

"""An assigned AT&T phone number."""
type PhoneNumber {
  id: ID!
  number: PhoneNumberString!
  subscriber: Subscriber
  type: String
  portRequest: PortRequest
  createdAt: DateTime!
}

"""Mobile Subscriber Integrated Services Digital Network number."""
type MSISDN {
  id: ID!
  value: String!
  subscriber: Subscriber!
  countryCode: String!
  nationalNumber: String!
}

"""International Mobile Equipment Identity — device hardware identifier."""
type IMEI {
  id: ID!
  value: String!
  device: Device!
  tac: String
  serialNumber: String
  checkDigit: String
  blacklisted: Boolean!
}

# ─── Device & SIM ───────────────────────────────────────────────────────────

"""A physical handset or connected device on the AT&T network."""
type Device {
  id: ID!
  type: DeviceType!
  make: String!
  model: String!
  os: String
  osVersion: String
  imei: IMEI
  simCard: SIMCard
  subscriber: Subscriber
  networkTechnology: NetworkTechnology
  upgradeEligibility: UpgradeEligibility
  instalmentPlan: EquipmentInstallment
  createdAt: DateTime!
  modifiedAt: DateTime!
}

"""A SIM card associated with a subscriber and device."""
type SIMCard {
  id: ID!
  iccid: String!
  imsi: String
  subscriber: Subscriber
  device: Device
  status: String!
  activatedAt: DateTime
  createdAt: DateTime!
}

"""A connected IoT endpoint (sensor, tracker, asset tag)."""
type IoTDevice {
  id: ID!
  name: String!
  deviceType: String!
  iotSim: IoTSIM
  location: Location
  status: String!
  lastSeen: DateTime
  metadata: JSON
  createdAt: DateTime!
  modifiedAt: DateTime!
}

"""A SIM provisioned for IoT or machine-to-machine use."""
type IoTSIM {
  id: ID!
  iccid: String!
  imsi: String
  device: IoTDevice
  plan: ServicePlan
  status: String!
  dataUsage: DataUsage
  activatedAt: DateTime
  createdAt: DateTime!
}

"""A SIM used in fleet or transportation management."""
type FleetSIM {
  id: ID!
  iccid: String!
  vehicleId: String
  vehicleType: String
  account: Account!
  plan: ServicePlan
  dataUsage: DataUsage
  location: Location
  status: String!
  createdAt: DateTime!
}

"""Automotive connectivity profile with telematics."""
type ConnectedCar {
  id: ID!
  vin: String!
  make: String
  model: String
  year: Int
  simCard: SIMCard
  subscriber: Subscriber
  location: Location
  telematics: JSON
  status: String!
  createdAt: DateTime!
  modifiedAt: DateTime!
}

# ─── Plans & Features ───────────────────────────────────────────────────────

"""A base service plan for a subscriber."""
type Plan {
  id: ID!
  name: String!
  type: PlanType!
  description: String
  monthlyRate: Float!
  currency: String!
  dataAllowanceGB: Float
  voiceMinutes: Int
  smsCount: Int
  mmsCount: Int
  hotspotGB: Float
  international: Boolean!
  createdAt: DateTime!
  modifiedAt: DateTime!
}

"""A configured plan combining voice, data, and messaging tiers."""
type ServicePlan {
  id: ID!
  plan: Plan!
  subscriber: Subscriber
  dataPlan: DataPlan
  voicePlan: VoicePlan
  messagePlan: MessagePlan
  addOns: [AddOn!]
  features: [Feature!]
  effectiveDate: Date!
  expiryDate: Date
  autoRenew: Boolean!
  createdAt: DateTime!
}

"""The data allocation component of a plan."""
type DataPlan {
  id: ID!
  servicePlan: ServicePlan!
  totalGB: Float!
  hotspotGB: Float
  streamingQuality: String
  throttleSpeedKbps: Int
  rollover: Boolean!
  createdAt: DateTime!
}

"""Voice minutes and calling allowances."""
type VoicePlan {
  id: ID!
  servicePlan: ServicePlan!
  minutesIncluded: Int
  unlimitedDomestic: Boolean!
  internationalMinutes: Int
  wifiCalling: Boolean!
  hdVoice: Boolean!
  createdAt: DateTime!
}

"""SMS/MMS messaging allocations."""
type MessagePlan {
  id: ID!
  servicePlan: ServicePlan!
  smsIncluded: Int
  mmsIncluded: Int
  unlimitedSMS: Boolean!
  internationalSMS: Boolean!
  createdAt: DateTime!
}

"""An optional service addition to a base plan."""
type AddOn {
  id: ID!
  name: String!
  description: String
  category: String
  monthlyRate: Float!
  currency: String!
  oneTime: Boolean!
  active: Boolean!
  createdAt: DateTime!
}

"""A specific capability enabled on an account or line."""
type Feature {
  id: ID!
  name: String!
  code: String
  description: String
  enabled: Boolean!
  category: String
  createdAt: DateTime!
}

"""A group or corporate service plan with shared resource pools."""
type EnterprisePlan {
  id: ID!
  account: Account!
  name: String!
  type: PlanType!
  sharedDataPoolGB: Float
  subscriberCount: Int!
  maxSubscribers: Int
  dedicatedSupport: Boolean!
  sla: String
  contractId: String
  createdAt: DateTime!
  modifiedAt: DateTime!
}

# ─── Voice Services ─────────────────────────────────────────────────────────

"""A live or completed voice call event."""
type VoiceCall {
  id: ID!
  subscriber: Subscriber!
  direction: CallDirection!
  status: CallStatus!
  fromNumber: PhoneNumberString!
  toNumber: PhoneNumberString!
  startedAt: DateTime
  endedAt: DateTime
  durationSeconds: Int
  networkTechnology: NetworkTechnology
  location: Location
  callDetail: CallDetail
  createdAt: DateTime!
}

"""A stored summary of a completed call."""
type CallRecord {
  id: ID!
  subscriber: Subscriber!
  call: VoiceCall
  direction: CallDirection!
  fromNumber: PhoneNumberString!
  toNumber: PhoneNumberString!
  durationSeconds: Int!
  charge: Float
  currency: String
  date: DateTime!
  roaming: Boolean!
}

"""Itemized call data including duration, cost, and parties."""
type CallDetail {
  id: ID!
  call: VoiceCall!
  billedMinutes: Int!
  ratePerMinute: Float
  totalCharge: Float!
  currency: String!
  taxAmount: Float
  roamingZone: RoamingZone
  notes: String
}

"""A voicemail message left for a subscriber."""
type Voicemail {
  id: ID!
  subscriber: Subscriber!
  fromNumber: PhoneNumberString!
  durationSeconds: Int!
  transcription: String
  listened: Boolean!
  saved: Boolean!
  receivedAt: DateTime!
}

"""The recorded greeting for a subscriber's voicemail mailbox."""
type VoicemailGreeting {
  id: ID!
  subscriber: Subscriber!
  type: String!
  audioUrl: URL
  durationSeconds: Int
  active: Boolean!
  createdAt: DateTime!
}

"""Rules for redirecting incoming calls."""
type CallForwarding {
  id: ID!
  subscriber: Subscriber!
  enabled: Boolean!
  forwardToNumber: PhoneNumberString
  forwardOnBusy: Boolean!
  forwardOnNoAnswer: Boolean!
  forwardAlways: Boolean!
  ringsBeforeForward: Int
  updatedAt: DateTime!
}

"""Caller identification settings and data."""
type CallerId {
  id: ID!
  subscriber: Subscriber!
  displayName: String
  displayNumber: PhoneNumberString
  blockOutbound: Boolean!
  showOnIncoming: Boolean!
  updatedAt: DateTime!
}

"""A multi-party audio conference session configuration."""
type Conference {
  id: ID!
  account: Account!
  name: String!
  accessCode: String!
  moderatorCode: String
  maxParticipants: Int!
  recordingEnabled: Boolean!
  scheduledAt: DateTime
  createdAt: DateTime!
}

"""A specific conference call instance."""
type ConferenceCall {
  id: ID!
  conference: Conference!
  startedAt: DateTime!
  endedAt: DateTime
  durationSeconds: Int
  participants: [Participant!]
  recorded: Boolean!
  recordingUrl: URL
  createdAt: DateTime!
}

"""An individual party in a conference call."""
type Participant {
  id: ID!
  conferenceCall: ConferenceCall!
  phoneNumber: PhoneNumberString!
  name: String
  joinedAt: DateTime!
  leftAt: DateTime
  durationSeconds: Int
  muted: Boolean!
  moderator: Boolean!
}

# ─── Messaging Services ──────────────────────────────────────────────────────

"""A short message service text."""
type SMS {
  id: ID!
  subscriber: Subscriber!
  direction: CallDirection!
  fromNumber: PhoneNumberString!
  toNumber: PhoneNumberString!
  body: String!
  status: MessageStatus!
  thread: MessageThread
  sentAt: DateTime!
  deliveredAt: DateTime
  charge: Float
}

"""A multimedia message with attachments."""
type MMSMessage {
  id: ID!
  subscriber: Subscriber!
  direction: CallDirection!
  fromNumber: PhoneNumberString!
  toNumber: [PhoneNumberString!]!
  subject: String
  body: String
  attachments: [MessageAttachment!]
  status: MessageStatus!
  thread: MessageThread
  sentAt: DateTime!
  deliveredAt: DateTime
  charge: Float
}

"""A conversation thread grouping messages between parties."""
type MessageThread {
  id: ID!
  subscriber: Subscriber!
  participants: [PhoneNumberString!]!
  messages: [SMS!]
  mmsMessages: [MMSMessage!]
  lastMessageAt: DateTime
  messageCount: Int!
  createdAt: DateTime!
}

"""A media file or document attached to an MMS."""
type MessageAttachment {
  id: ID!
  mmsMessage: MMSMessage!
  fileName: String
  mimeType: String!
  sizeBytes: Int
  url: URL
  createdAt: DateTime!
}

# ─── Data & Roaming ──────────────────────────────────────────────────────────

"""An active or historical mobile data session."""
type DataSession {
  id: ID!
  subscriber: Subscriber!
  startedAt: DateTime!
  endedAt: DateTime
  durationSeconds: Int
  dataConsumedMB: Float!
  networkTechnology: NetworkTechnology
  apn: String
  ipAddress: String
  location: Location
  roaming: Boolean!
  roamingZone: RoamingZone
}

"""Consumed data metrics for a billing period or session."""
type DataUsage {
  id: ID!
  subscriber: Subscriber
  periodStart: Date!
  periodEnd: Date!
  totalConsumedGB: Float!
  hotspotConsumedGB: Float
  roamingConsumedGB: Float
  streamingConsumedGB: Float
  updatedAt: DateTime!
}

"""Remaining data allowance on a plan."""
type DataBalance {
  id: ID!
  subscriber: Subscriber!
  totalGB: Float!
  usedGB: Float!
  remainingGB: Float!
  hotspotRemainingGB: Float
  roamingRemainingGB: Float
  resetDate: Date!
  updatedAt: DateTime!
}

"""Roaming configuration for international use."""
type RoamingProfile {
  id: ID!
  subscriber: Subscriber!
  status: RoamingStatus!
  dataRoaming: Boolean!
  voiceRoaming: Boolean!
  smsRoaming: Boolean!
  zones: [RoamingZone!]
  updatedAt: DateTime!
}

"""A geographic zone with specific roaming rates."""
type RoamingZone {
  id: ID!
  name: String!
  countries: [String!]!
  dataRateMBPerUSD: Float
  voiceRatePerMinute: Float
  smsRatePerMessage: Float
  includedInPlan: Boolean!
}

"""An international data add-on or usage record."""
type InternationalData {
  id: ID!
  subscriber: Subscriber!
  zone: RoamingZone!
  addOnGB: Float
  usedMB: Float!
  startDate: Date!
  endDate: Date
  charge: Float
  currency: String
}

"""A call made to or from an international number."""
type InternationalCall {
  id: ID!
  subscriber: Subscriber!
  direction: CallDirection!
  fromNumber: PhoneNumberString!
  toNumber: PhoneNumberString!
  destinationCountry: String!
  durationSeconds: Int!
  ratePerMinute: Float!
  totalCharge: Float!
  currency: String!
  date: DateTime!
}

# ─── Network Infrastructure ──────────────────────────────────────────────────

"""A logical AT&T network service instance."""
type NetworkService {
  id: ID!
  name: String!
  type: String!
  technology: NetworkTechnology!
  region: String
  status: String!
  uptime: Float
  createdAt: DateTime!
  modifiedAt: DateTime!
}

"""A 5G network slice with dedicated QoS parameters."""
type NetworkSlice {
  id: ID!
  name: String!
  sliceType: String!
  maxBandwidthMbps: Int
  latencyMs: Int
