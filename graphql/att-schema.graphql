# ─── Security & Access ────────────────────────────────────────────────────────

"""An API credential key for developer access."""
type APIKey {
  id: ID!
  account: Account!
  name: String!
  keyPrefix: String!
  scopes: [String!]!
  active: Boolean!
  expiresAt: DateTime
  lastUsedAt: DateTime
