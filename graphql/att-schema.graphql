}

"""A geographic region with defined network coverage."""
type CoverageArea {
  id: ID!
  name: String!
  type: String!
  technology: NetworkTechnology!
  polygon: JSON
  qualityScore: Float
  avgDownloadMbps: Float
  avgUploadMbps: Float
  updatedAt: DateTime!
}

"""A logged network incident, outage, or status change."""
type NetworkEvent {
  id: ID!
  type: String!
  severity: String!
  technology: NetworkTechnology
  region: String
  affectedTowers: [Tower!]
  description: String!
  startedAt: DateTime!
  resolvedAt: DateTime
  impactedSubscribers: Int
  createdAt: DateTime!
}

# ─── Location ────────────────────────────────────────────────────────────────

"""A geographic location point with coordinates."""
type Location {
  id: ID!
  latitude: GeoCoordinate!
  longitude: GeoCoordinate!
  accuracy: Float
  altitude: Float
  address: String
  city: String
  state: String
  country: String
