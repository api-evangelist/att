}

"""The date range covered by a billing cycle."""
type BillingPeriod {
  id: ID!
  account: Account!
  startDate: Date!
  endDate: Date!
  invoices: [Invoice!]
}

"""An individual charge item on an AT&T invoice."""
type Charge {
  id: ID!
  invoice: Invoice!
  description: String!
  category: String!
  amount: Float!
  currency: String!
  taxable: Boolean!
  subscriber: Subscriber
  date: Date!
}

"""A payment transaction applied to an AT&T account."""
type Payment {
  id: ID!
  account: Account!
  invoice: Invoice
  amount: Float!
  currency: String!
  method: PaymentMethod
  status: PaymentStatus!
  confirmationNumber: String
  processedAt: DateTime
  createdAt: DateTime!
}

"""A stored payment instrument for an account."""
type PaymentMethod {
  id: ID!
  account: Account!
  type: String!
  last4: String
  brand: String
  bankName: String
  expiryDate: String
  isDefault: Boolean!
  autopayEnabled: Boolean!
  createdAt: DateTime!
}

"""A service agreement with terms and commitment period."""
type Contract {
  id: ID!
  account: Account!
  type: String!
  startDate: Date!
  endDate: Date
  termMonths: Int
  earlyTerminationFee: Float
  autoRenew: Boolean!
  status: String!
  signedAt: DateTime
  createdAt: DateTime!
}

"""An installment plan for device financing."""
type EquipmentInstallment {
  id: ID!
  account: Account!
  device: Device!
  retailPrice: Float!
  downPayment: Float!
  monthlyInstallment: Float!
  remainingBalance: Float!
  currency: String!
  termMonths: Int!
  paidMonths: Int!
  nextDueDate: Date
  createdAt: DateTime!
}

