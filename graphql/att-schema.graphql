}

"""A defined geographic boundary for alerts or tracking."""
type Geofence {
  id: ID!
  name: String!
  account: Account!
  polygon: JSON!
  radiusMeters: Float
  alertOnEntry: Boolean!
  alertOnExit: Boolean!
  active: Boolean!
  createdAt: DateTime!
  modifiedAt: DateTime!
}

# ─── Number Portability ──────────────────────────────────────────────────────

"""A number porting transaction."""
type NumberPorting {
  id: ID!
  account: Account!
  portRequests: [PortRequest!]
  createdAt: DateTime!
}

"""A submitted request to port a phone number in or out of AT&T."""
type PortRequest {
  id: ID!
  phoneNumber: PhoneNumber!
  portingDirection: String!
  donorCarrier: String
  recipientCarrier: String
  status: PortStatus!
  requestedPortDate: Date
  completedAt: DateTime
  rejectionReason: String
  submittedAt: DateTime!
}

# ─── Billing & Payments ──────────────────────────────────────────────────────

"""A billing statement for an AT&T account period."""
type Invoice {
  id: ID!
  account: Account!
  billingPeriod: BillingPeriod!
  charges: [Charge!]
  subtotal: Float!
  taxes: Float!
  fees: Float!
  totalDue: Float!
  currency: String!
  dueDate: Date!
  paid: Boolean!
