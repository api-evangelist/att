# ─── Queries ─────────────────────────────────────────────────────────────────

type Query {
  account(id: ID!): Account
  accounts(status: AccountStatus, limit: Int, offset: Int): [Account!]!

  subscriber(id: ID!): Subscriber
  subscribers(accountId: ID!, status: SubscriberStatus, limit: Int, offset: Int): [Subscriber!]!

  phoneNumber(number: PhoneNumberString!): PhoneNumber
  device(id: ID!): Device
  simCard(iccid: String!): SIMCard
  iotDevice(id: ID!): IoTDevice
  iotDevices(accountId: ID!, limit: Int, offset: Int): [IoTDevice!]!
  connectedCar(vin: String!): ConnectedCar
  fleetSIMs(accountId: ID!, limit: Int, offset: Int): [FleetSIM!]!

  plan(id: ID!): Plan
  plans(type: PlanType, limit: Int, offset: Int): [Plan!]!
  servicePlan(id: ID!): ServicePlan
  addOns(planType: PlanType): [AddOn!]!

  callRecord(id: ID!): CallRecord
  callRecords(subscriberId: ID!, startDate: Date, endDate: Date, limit: Int, offset: Int): [CallRecord!]!
  voicemails(subscriberId: ID!, listened: Boolean, limit: Int, offset: Int): [Voicemail!]!
  conferences(accountId: ID!, limit: Int, offset: Int): [Conference!]!

  smsMessages(subscriberId: ID!, startDate: Date, endDate: Date, limit: Int, offset: Int): [SMS!]!
  mmsMessages(subscriberId: ID!, limit: Int, offset: Int): [MMSMessage!]!
  messageThread(id: ID!): MessageThread
  messageThreads(subscriberId: ID!, limit: Int, offset: Int): [MessageThread!]!

  dataUsage(subscriberId: ID!, periodStart: Date, periodEnd: Date): DataUsage
  dataBalance(subscriberId: ID!): DataBalance
  dataSessions(subscriberId: ID!, startDate: Date, endDate: Date, limit: Int, offset: Int): [DataSession!]!
  roamingProfile(subscriberId: ID!): RoamingProfile
  roamingZones: [RoamingZone!]!

  coverageArea(lat: GeoCoordinate!, lon: GeoCoordinate!, technology: NetworkTechnology): CoverageArea
  tower(id: ID!): Tower
  towers(region: String, technology: NetworkTechnology, limit: Int, offset: Int): [Tower!]!
  networkEvents(region: String, severity: String, limit: Int, offset: Int): [NetworkEvent!]!
  networkSlice(id: ID!): NetworkSlice

  invoice(id: ID!): Invoice
  invoices(accountId: ID!, limit: Int, offset: Int): [Invoice!]!
  billingPeriod(id: ID!): BillingPeriod
  payments(accountId: ID!, limit: Int, offset: Int): [Payment!]!

  deviceUpgrade(subscriberId: ID!): DeviceUpgrade
  tradeIn(id: ID!): TradeIn
  portRequest(id: ID!): PortRequest

  supportTicket(id: ID!): SupportTicket
  supportTickets(accountId: ID!, status: TicketStatus, priority: TicketPriority, limit: Int, offset: Int): [SupportTicket!]!
}

# ─── Mutations ───────────────────────────────────────────────────────────────

type Mutation {
  activateSubscriber(subscriberId: ID!, planId: ID!): Subscriber
  suspendSubscriber(subscriberId: ID!, reason: String): Subscriber
  updateServicePlan(subscriberId: ID!, planId: ID!): ServicePlan
  addAddOn(subscriberId: ID!, addOnId: ID!): AddOn
  removeAddOn(subscriberId: ID!, addOnId: ID!): Boolean

  updateCallForwarding(subscriberId: ID!, enabled: Boolean!, forwardToNumber: PhoneNumberString): CallForwarding
  updateCallerId(subscriberId: ID!, displayName: String, blockOutbound: Boolean): CallerId
  deleteVoicemail(voicemailId: ID!): Boolean
  markVoicemailListened(voicemailId: ID!): Voicemail
  setVoicemailGreeting(subscriberId: ID!, type: String!, audioUrl: URL): VoicemailGreeting

  sendSMS(subscriberId: ID!, toNumber: PhoneNumberString!, body: String!): SMS
  sendMMS(subscriberId: ID!, toNumbers: [PhoneNumberString!]!, subject: String, body: String, attachmentUrls: [URL!]): MMSMessage

  enableRoaming(subscriberId: ID!, zones: [ID!]): RoamingProfile
  disableRoaming(subscriberId: ID!): RoamingProfile

  createConference(accountId: ID!, name: String!, maxParticipants: Int!, scheduledAt: DateTime): Conference
  addParticipant(conferenceCallId: ID!, phoneNumber: PhoneNumberString!, moderator: Boolean): Participant
  endConferenceCall(conferenceCallId: ID!): ConferenceCall

  submitPortRequest(phoneNumber: PhoneNumberString!, donorCarrier: String!, requestedPortDate: Date): PortRequest
  cancelPortRequest(portRequestId: ID!): PortRequest

  createPayment(accountId: ID!, invoiceId: ID!, amount: Float!, paymentMethodId: ID!): Payment
  addPaymentMethod(accountId: ID!, type: String!, token: String!, setDefault: Boolean): PaymentMethod
  removePaymentMethod(paymentMethodId: ID!): Boolean

  submitTradeIn(accountId: ID!, deviceMake: String!, deviceModel: String!, condition: String!): TradeIn
  initiateDeviceUpgrade(subscriberId: ID!, newDeviceId: ID!, tradeInId: ID): DeviceUpgrade

  createSupportTicket(accountId: ID!, subscriberId: ID, category: String!, subject: String!, description: String!, priority: TicketPriority): SupportTicket
  updateSupportTicket(ticketId: ID!, status: TicketStatus, resolution: String): SupportTicket

  createGeofence(accountId: ID!, name: String!, polygon: JSON!, alertOnEntry: Boolean!, alertOnExit: Boolean!): Geofence
  deleteGeofence(geofenceId: ID!): Boolean

  createAPIKey(accountId: ID!, name: String!, scopes: [String!]!, expiresAt: DateTime): APIKey
  revokeAPIKey(apiKeyId: ID!): Boolean
  revokeToken(tokenId: ID!): Boolean
}

# ─── Subscriptions ────────────────────────────────────────────────────────────

type Subscription {
  networkEventCreated(region: String, technology: NetworkTechnology): NetworkEvent
  incomingCall(subscriberId: ID!): VoiceCall
  incomingSMS(subscriberId: ID!): SMS
  dataBalanceLow(subscriberId: ID!, thresholdGB: Float!): DataBalance
  supportTicketUpdated(accountId: ID!): SupportTicket
  geofenceAlert(geofenceId: ID!): Location
  iotDeviceAlert(accountId: ID!): IoTDevice
}
