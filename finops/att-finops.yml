principles:
- name: Visibility
  description: Track AT&T consumption monthly.
- name: Allocation
  description: Tag usage to teams/cost centers for chargeback.
- name: Optimization
  description: Right-size; reclaim unused entitlements.
- name: Accountability
  description: Set spend alerts; quarterly review.
- name: Visibility
  description: Once GA, expect AT&T to expose a developer console with usage dashboards; pre-GA, maintain client-side
    counters per CAMARA API and per outcome.
- name: Allocation
  description: Tag every CAMARA call with consuming product / fraud-prevention surface in your own app telemetry
    to support showback before AT&T's invoice arrives.
- name: Optimization
  description: For SIM-swap and number-verify, batch user enrollment events; for QoD, tear down sessions promptly.
    Avoid speculative pre-flight calls during low-risk transactions.
- name: Accountability
  description: Fraud / risk and identity engineering teams typically own CAMARA spend; pair with finance on per-verification
    ROI vs fraud loss avoided.
